{% extends "base.html" %}
{% block title %}نام استاد{% endblock %}
{% block content %}
<main class="form-page">
    <div class="form-card">
        {% include "_stepper.html" %}

        <h1 class="form-title">نام استادی که TA او بوده‌اید</h1>
        <p class="form-hint">این فیلد الزامی است.</p>

        <form method="POST" novalidate>
            <div class="field {% if error %}field-error{% endif %}">
                <label for="professor_name">نام کامل استاد</label>
                <select
                    id="professor_name"
                    name="professor_name"
                    required
                    autofocus>
                    <option value="" disabled {% if not value %}selected{% endif %}>
                        نام استاد درس را انتخاب کنید
                    </option>

                    {% for professor in professors %}
                    <option
                        value="{{ professor }}"
                        {% if professor == value %}selected{% endif %}>
                        {{ professor }}
                    </option>
                    {% endfor %}
                </select>
                {% if error %}
                    <p class="error-text">{{ error }}</p>
                {% endif %}
            </div>

            <div class="form-actions">
                <a href="{{ url_for('course') }}" class="btn btn-ghost">بازگشت</a>
                <button type="submit" class="btn btn-primary">مرحله بعد 
                    <span class="btn-arrow" aria-hidden="true">‹</span>
                </button>
            </div>
        </form>
    </div>
</main>
{% endblock %}
