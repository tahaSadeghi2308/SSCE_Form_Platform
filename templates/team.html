{% extends "base.html" %}
{% block title %}اعضای تیم{% endblock %}
{% block content %}
<main class="form-page">
    <div class="form-card form-card-wide">
        {% include "_stepper.html" %}

        <h1 class="form-title">اعضای تیم و سمت‌شان</h1>
        <p class="form-hint">حداقل یک عضو باید ثبت شود. هر تعداد عضو که نیاز دارید اضافه کنید.</p>

        <form id="member-form" class="member-form" novalidate>
            <div class="field field-name">
                <label for="member_name">نام عضو</label>
                <input type="text" id="member_name" name="member_name" placeholder="نام و نام‌خانوادگی" required>
            </div>
            <div class="field field-role">
                <label for="member_role">سمت</label>
                <select id="member_role" name="member_role" required>
                    <option value="" disabled selected>انتخاب کنید</option>
                    {% for role in roles %}
                    <option value="{{ role }}">{{ role }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="field field-submit">
                <button type="submit" class="btn btn-primary" id="add-member-btn">+ افزودن عضو</button>
            </div>
        </form>
        <p class="error-text" id="member-form-error" hidden></p>

        <div class="table-wrap" id="table-wrap">
            <table class="member-table">
                <thead>
                    <tr>
                        <th class="col-index">#</th>
                        <th>نام عضو</th>
                        <th>سمت</th>
                        <th class="col-actions">عملیات</th>
                    </tr>
                </thead>
                <tbody id="member-tbody"></tbody>
            </table>
            <p class="empty-state" id="empty-state" hidden>هنوز عضوی ثبت نشده است.</p>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('professor') }}" class="btn btn-ghost">بازگشت</a>
            <a href="{{ url_for('leader') }}" class="btn btn-primary" id="next-step-btn">مرحله بعد 
                <span class="btn-arrow" aria-hidden="true">‹</span>
            </a>
        </div>
    </div>
</main>

<script>
    window.__TEAM_DATA__ = {
        members: {{ members | tojson }},
        roles: {{ roles | tojson }},
        membersApiUrl: "{{ url_for('add_member') }}"
    };
</script>
<script src="{{ url_for('static', filename='js/team.js') }}"></script>
{% endblock %}
